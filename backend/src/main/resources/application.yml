spring:
  application:
    name: homecenter

  # Blocking SMB I/O runs on virtual threads; see doc/implementation-plan.md.
  threads:
    virtual:
      enabled: true

  datasource:
    # H2 in file mode; a single server process keeps the database open.
    url: jdbc:h2:file:${homecenter.data-dir}/homecenter
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: homecenter-h2
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: true

server:
  port: 8085
  shutdown: graceful

homecenter:
  # Where the server stores its H2 index (and later thumbnails).
  data-dir: ./data

  security:
    # How long an Android client login remains valid. The TV does not log in frequently,
    # so this is measured in months; the token can be invalidated from the management UI.
    token-validity: 90d

  library:
    # The extension assigns a file to one of the three categories visible to the TV client.
    # The scanner skips anything not listed here.
    video-extensions: [ mkv, mp4, avi, mov, m4v, wmv, mpg, mpeg, ts, m2ts, webm, flv, 3gp ]
    photo-extensions: [ jpg, jpeg, png, gif, bmp, webp, heic, heif, tif, tiff ]
    audio-extensions: [ mp3, flac, m4a, aac, ogg, oga, opus, wav, wma, alac, aiff ]

  metadata:
    # TMDb API Read Access Token z https://www.themoviedb.org/settings/api.
    # An empty value disables enrichment; the token is never logged or sent to the client.
    tmdb-read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    language: sk-SK
    fallback-language: en-US
    # TMDb terms allow caching for at most six months; refresh considerably sooner.
    refresh-after: 30d
    retry-after: 1d
    # The first large scan must not flood the public API with requests.
    request-delay: 250ms
    api-base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/w342

  scan:
    # Nightly background scan. Manual scans start from the management UI or REST API.
    cron: "0 30 3 * * *"
    on-startup: false
    max-depth: 32

  streaming:
    # Size of one block transferred from Samba to an HTTP response.
    buffer-size: 256KB

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui.html
  # The specification is the contract with the Android TV client, so it describes only
  # what the client may call. The /admin/** endpoints are internal to the management UI
  # (see the Thymeleaf/REST separation) and the client never calls them; generating a
  # Kotlin API for them would suggest otherwise.
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    org.javerland.homecenter: INFO
    com.hierynomus: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false

logging:
  level:
    org.javerland.homecenter: DEBUG
