homecenter:
  data-dir: ./target
  metadata:
    # Tests must never reach the internet; without this the token-free Cinemeta fallback
    # would become the active provider.
    cinemeta-fallback: false
  scan:
    # '-' disables the scheduled task; tests start scans themselves.
    cron: "-"
    on-startup: false

spring:
  # Tests use in-memory H2, leaving no files to clean up between runs.
  datasource:
    url: jdbc:h2:mem:homecenter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  thymeleaf:
    cache: false
